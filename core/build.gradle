dependencies {
    compileOnly 'com.github.retrooper:packetevents-spigot:2.14.0'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    compileOnly 'io.papermc.paper:paper-api:26.2.build.129-stable'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'com.github.NEZNAMY:TAB-API:6.1.2'

    compileOnly platform('com.intellectualsites.bom:bom-newest:1.56')
    // Override the older FAWE version selected by the BOM.
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.15.3'
    compileOnly('com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.15.3') {
        exclude module: 'FastAsyncWorldEdit-Core'
    }

    implementation 'dev.dejvokep:boosted-yaml:1.3.7'
    implementation 'net.wesjd:anvilgui:1.10.13-SNAPSHOT'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'dev.faststats.metrics:bukkit:0.30.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.10'
    implementation 'net.megavex:scoreboard-library-api:2.8.2'
    runtimeOnly 'net.megavex:scoreboard-library-implementation:2.8.2'
    implementation 'com.github.sylveya:ZonePracticePro-Api:2.4.0'

    constraints {
        implementation('com.google.errorprone:error_prone_annotations:2.50.0') {
            because 'Use the latest stable annotations required by Gson.'
        }
        implementation('org.slf4j:slf4j-api:2.0.20') {
            because 'Use the latest stable SLF4J API with HikariCP.'
        }
    }
}

tasks.named('processResources') {
    def pluginVersion = project.version.toString()
    inputs.property 'version', pluginVersion
    filesMatching('plugin.yml') {
        expand version: pluginVersion
    }
}
